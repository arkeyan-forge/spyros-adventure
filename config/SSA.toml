# XenonRecomp config for Skylanders: Spyro's Adventure (Xbox 360, title 415608AB, media 53CE7B97).
# Addresses found by byte pattern (see XenonRecomp README) in the decrypted image from tools/xexdump.
[main]
file_path = "../private/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "SSA_switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

restgprlr_14_address = 0x825F5CE0
savegprlr_14_address = 0x825F5C90
restfpr_14_address = 0x825F647C
savefpr_14_address = 0x825F6430
restvmx_14_address = 0x825FF3D8
savevmx_14_address = 0x825FF140
restvmx_64_address = 0x825FF46C
savevmx_64_address = 0x825FF1D4

# longjmp: restores f14-f31/r13-r31 from the jmp_buf, calls RtlUnwind when an unwind func is set.
longjmp_address = 0x825F8430
# setjmp: mirror stores (stfd f14, 0(r3) ...) behind a hook-pointer check.
setjmp_address = 0x825FECA0

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
    { data = 0x825FFC00, size = 8 }, # __CxxFrameHandler + FuncInfo, before C++ EH functions
    { data = 0x829E6114, size = 8 }, # __C_specific_handler (import thunk) + scope table, before SEH functions
    { data = 0x8260CA80, size = 8 }, # custom handler + null data, before 0x8260CA5C
]

# Non-.pdata functions XenonRecomp's analyzer can't size (jump tables, bdz chains, adapters that `b` into the next function,
# vtable targets merged into a neighbour, leaf functions packed together).
